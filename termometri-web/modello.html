<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>SP500 Vertical Thermometers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Termometri SMA200 e POC per tutti i componenti dell'S&P 500, voto fondamentale da SEC EDGAR e spiegazioni con Gemini.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23e11d48'/><stop offset='.5' stop-color='%23f59e0b'/><stop offset='1' stop-color='%2310b981'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='%230b2530'/><rect x='24' y='6' width='16' height='52' rx='8' fill='url(%23g)'/><rect x='18' y='30' width='28' height='4' rx='2' fill='white'/></svg>">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  /* Stesso tema chiaro "da sviluppatore" del sito: un solo accento blu, Inter + JetBrains Mono. */
  :root {
    color-scheme: light;
    --app-bg: #e9f4f3; --header-bg: #ffffff; --header-fg: #0b2530; --header-sub: #5a7480;
    --card-bg: #ffffff; --card-bg-2: #f3faf9; --card-border: rgba(11, 37, 48, .1); --text: #0b2530; --muted: #5a7480;
    --accent: #0f766e; --accent-hover: #115e59; --accent-soft: rgba(15, 118, 110, .07); --accent-line: rgba(15, 118, 110, .3);
    --good: #059669; --bad: #e11d48;
    --line: rgba(11, 37, 48, .1); --line-strong: rgba(11, 37, 48, .18);
    --shadow: 0 1px 2px rgba(11, 37, 48, .05), 0 8px 24px rgba(11, 37, 48, .05);
    --strip: linear-gradient(90deg, #0f766e, #0891b2, #059669);
    --font: "Inter", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  html { background: var(--app-bg); }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 70% 40% at 50% -5%, rgba(15, 118, 110, .08), transparent 70%),
      radial-gradient(rgba(11, 37, 48, .1) 1px, transparent 1px) 0 0 / 26px 26px,
      var(--app-bg);
    background-attachment: fixed;
  }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }

  /* ---------- testata ---------- */
  header.top { background: rgba(255, 255, 255, .9); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
  .row1 { display: flex; align-items: center; gap: 16px 20px; padding: 15px 26px; flex-wrap: wrap; }
  .title { font-size: 24px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; white-space: nowrap; }
  .title .a { color: var(--text); } .title .b { color: var(--accent); }
  .subtitle { color: var(--header-sub); font-family: var(--mono); font-size: 12px; margin-top: 4px; }
  .back { font-size: 12.5px; color: var(--header-sub); text-decoration: none; }
  .back:hover { color: var(--accent); }
  .search { flex: 1 1 280px; min-width: 240px; display: flex; align-items: center; background: #fff;
    border: 1px solid var(--line-strong); border-radius: 9px; padding: 3px; transition: border-color .2s, box-shadow .2s; }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 118, 110, .14); }
  .search .ico { color: var(--muted); padding: 0 4px 0 10px; font-size: 15px; }
  .search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; padding: 8px 6px; font-size: 15px; color: var(--text); }
  .search input::placeholder { color: #94a3b8; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line-strong); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13.5px; padding: 10px 16px; white-space: nowrap;
    background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(11, 37, 48, .05); transition: background .15s, color .15s, border-color .15s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .btn:disabled { cursor: default; opacity: .55; }
  .btn.accent { background: var(--accent); border-color: transparent; color: #fff; } .btn.accent:hover { background: var(--accent-hover); color: #fff; }
  .btn.accent:disabled { background: #8cc9c2; color: #fff; opacity: 1; }
  .btn.magenta { background: #0b2530; border-color: transparent; color: #fff; } .btn.magenta:hover { background: #1e293b; color: #fff; }
  .btn.magenta:disabled { background: #94a3b8; color: #fff; opacity: 1; }
  .btn.search-btn { background: var(--accent); border-color: transparent; color: #fff; padding: 8px 14px; box-shadow: none; } .btn.search-btn:hover { background: var(--accent-hover); color: #fff; }
  .btn.small { padding: 10px 13px; min-width: 44px; }
  .row2 { display: flex; align-items: center; gap: 10px 16px; padding: 4px 26px 14px; flex-wrap: wrap; }
  .group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .group .lbl { color: var(--header-sub); font-family: var(--mono); font-size: 11.5px; margin-right: 4px; }
  select.combo { background: #fff; color: var(--text); border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px 6px; font-size: 13.5px; }
  .strip { height: 2px; background: var(--strip); }
  .status { color: var(--muted); font-size: 13.5px; padding: 12px 26px 0; min-height: 30px; white-space: pre-line; }

  /* ---------- corpo ---------- */
  main { padding: 12px 18px 40px; }
  .main-card { margin: 18px auto 0; max-width: 1080px; border-radius: 14px; overflow: hidden;
    background: var(--card-bg); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .main-card svg { display: block; width: 100%; height: auto; }
  .section-head { max-width: 1080px; margin: 44px auto 18px; display: flex; gap: 12px; }
  .section-head .bar { width: 3px; border-radius: 2px; background: var(--accent); flex: none; }
  .section-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .section-head p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  .sector { max-width: var(--grid-w, 100%); margin: 8px auto 0; }
  .sector h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .sector .line { height: 1px; background: var(--line-strong); margin: 8px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(162px, 196px)); gap: 18px; justify-content: center; margin-bottom: 28px; }
  .empty { text-align: center; color: var(--muted); font-size: 16px; padding: 20px; white-space: pre-line; }
  .tile { position: relative; border-radius: 12px; cursor: pointer; content-visibility: auto; contain-intrinsic-size: 196px 214px;
    background: var(--card-bg); border: 1px solid var(--gl-border);
    box-shadow: 0 0 0 1px var(--gl-1), 0 1px 2px rgba(11, 37, 48, .05), 0 8px 20px rgba(11, 37, 48, .06); transition: transform .12s, box-shadow .12s; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--gl-2), 0 12px 28px rgba(11, 37, 48, .1); }
  .tile svg { display: block; width: 100%; height: auto; }
  svg text { font-family: var(--font); }
  svg .help { cursor: pointer; }

  /* ---------- finestre ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(11, 37, 48, .45); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px;
    overscroll-behavior: contain; }
  body:has(.overlay) { overflow: hidden; }
  .win { position: relative; background: var(--app-bg); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(11, 37, 48, .25);
    max-width: 100%; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; }
  .win .close { position: absolute; top: 8px; right: 10px; z-index: 2; background: transparent; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 6px; }
  .win .close:hover { color: var(--text); }
  .win-body { overflow: auto; }
  .detail { width: 780px; }
  .detail svg { display: block; width: 100%; height: auto; }
  .card-win { width: 500px; background: var(--card-bg); padding: 18px 20px 20px; }
  .card-win h3 { margin: 0 30px 6px 0; font-size: 18px; letter-spacing: -.02em; }
  .card-win .sub { color: var(--muted); font-family: var(--mono); font-size: 11.5px; margin-bottom: 12px; }
  .card-win .txt { font-size: 15px; white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; color: #2b4752;
    /* testi lunghi (spiegazioni Gemini): scorrono dentro la finestra, titolo e ✕ restano fermi */
    flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 8px; margin-right: -8px;
    scrollbar-width: thin; scrollbar-color: #bcd6d3 transparent; }
  .card-win .txt::-webkit-scrollbar { width: 6px; }
  .card-win .txt::-webkit-scrollbar-thumb { background: #bcd6d3; border-radius: 3px; }
  .card-win .txt.more { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 40px), transparent);
    mask-image: linear-gradient(180deg, #000 calc(100% - 40px), transparent); }
  .card-win .txt.muted { color: var(--muted); } .card-win .txt.bad { color: var(--bad); }
  .card-win input { width: 100%; background: #fff; color: var(--text); border: 1px solid var(--line-strong); border-radius: 8px; outline: 0; padding: 9px 10px; margin: 10px 0 4px; font-family: var(--mono); font-size: 14px; }
  .card-win input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 118, 110, .14); }
  .card-win .foot { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
  .card-win .btns { display: flex; justify-content: center; margin-top: 16px; }
  .search-win { width: 980px; height: calc(100vh - 32px); }
  .search-win .shead { background: var(--header-bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px 16px; padding: 12px 50px 12px 22px; flex-wrap: wrap; }
  .search-win .shead h3 { margin: 0; font-size: 19px; letter-spacing: -.02em; flex: 1 1 260px; }
  .search-win .search { flex: 0 1 380px; min-width: 220px; }
  .search-win .srow { display: flex; align-items: flex-start; gap: 10px; padding: 10px 22px 0; }
  .search-win .srow .st { flex: 1; color: var(--muted); font-size: 13.5px; white-space: pre-line; }
  .search-win .srow .st.bad { color: var(--bad); }
  .search-win .win-body { flex: 1; padding: 16px 12px 20px; }
  .loading { text-align: center; padding-top: 90px; }
  .loading b { color: var(--accent); font-size: 20px; display: block; }
  .loading span, .loading small { color: var(--muted); font-size: 13.5px; }
  .loading.none b { color: var(--text); }

  @media (max-width: 700px) {
    .row1, .row2 { padding-left: 14px; padding-right: 14px; }
    .status { padding-left: 14px; padding-right: 14px; }
    main { padding: 8px 10px 30px; }
    .title { font-size: 21px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .search-win { height: calc(100vh - 16px); height: calc(100dvh - 16px); } .overlay { padding: 8px; }
    .win { max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); }
    .card-win { padding: 16px 14px 16px 16px; }
    .card-win .txt { font-size: 14.5px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="row1">
    <div>
      <div class="title"><span class="a">Market</span><span class="b"> Thermometers</span></div>
      <div class="subtitle">S&amp;P 500 &nbsp;·&nbsp; SMA200 &nbsp;·&nbsp; Volume Profile POC &nbsp;·&nbsp; spiegazioni IA</div>
      <a class="back" href="../#trading">← Torna al sito</a>
    </div>
    <form class="search" id="searchForm" autocomplete="off">
      <span class="ico">🔍</span>
      <input id="searchInput" type="search" placeholder="Cerca un termometro: ticker, azienda, indice, materia prima…" enterkeyhint="search">
      <button class="btn search-btn" id="searchBtn" type="submit">Cerca</button>
    </form>
    <div class="actions">
      <button class="btn" id="keyBtn" type="button" title="Chiave API di Gemini">🔑 Gemini</button>
      <button class="btn magenta" id="semaphoreBtn" type="button">📊 Voto fondamentali</button>
      <button class="btn accent" id="refreshBtn" type="button">⟳&nbsp; Aggiorna</button>
    </div>
  </div>
  <div class="row2">
    <button class="btn" id="filterBtn" type="button"></button>
    <div class="group"><span class="lbl">Distanza SMA200</span><span id="thresholds"></span></div>
    <div class="group"><span class="lbl">Prezzo €</span><span class="lbl">da</span><select class="combo" id="priceMin"></select>
      <span class="lbl" style="margin-left:6px">a</span><select class="combo" id="priceMax"></select>
      <button class="btn small" id="priceReset" type="button" style="margin-left:6px">✕</button></div>
    <div class="group"><span class="lbl">Voto</span><span id="votes"></span></div>
  </div>
  <div class="strip"></div>
</header>
<div class="status" id="status">Caricamento dati...</div>
<main>
  <div class="main-card" id="mainCard"></div>
  <div class="section-head"><div class="bar"></div><div><h2 id="sectionTitle"></h2><p id="sectionSub"></p></div></div>
  <div id="grids"></div>
</main>

<script>

</script>
<script>
'use strict';
(function () {
  T.init(__DATA__, { proxy: '__PROXY_URL__', storage: (() => { try { return window.localStorage; } catch (_) { return null; } })() });
  const D = T.D;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- colori: tema chiaro del sito, stessi ruoli della tavolozza del desktop ----------
     (verde = sopra la media / voto alto, rosso = sotto / voto basso, ambra = SMA200, viola = POC;
     la linea del prezzo è scura con un alone chiaro, SHADOW, per staccarsi dal tubo colorato) */
  const C = {
    APP_BG: '#e9f4f3', HEADER_BG: '#ffffff', HEADER_FG: '#0b2530', CARD_BG: '#ffffff', CARD_BG_2: '#f3faf9',
    CARD_BORDER: '#d6e8e6', SHADOW: '#ffffff', TEXT: '#0b2530', MUTED: '#5a7480', ACCENT: '#0284c7', MAGENTA: '#db2777',
    VIOLET: '#7c3aed', PURPLE: '#9333ea', GOOD: '#059669', BAD: '#e11d48', TUBE_BORDER: '#bcd6d3',
    MARK_HIGH: '#e11d48', MARK_LOW: '#059669', MARK_SMA: '#d97706', PRICE: '#0b2530',
  };
  const GRAD_RED = [244, 63, 94], GRAD_YELLOW = [251, 191, 36], GRAD_GREEN = [16, 185, 129];
  const hexRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgbHex = (c) => '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  const lerp = (a, b, t) => { t = Math.min(Math.max(t, 0), 1); return a.map((v, i) => Math.round(v + (b[i] - v) * t)); };
  const blend = (bg, fg, t) => rgbHex(lerp(hexRgb(bg), hexRgb(fg), t));
  function gradientColorForValue(value, low, mid, high) {
    if (value >= mid) return rgbHex(lerp(GRAD_YELLOW, GRAD_RED, high <= mid ? 0 : (value - mid) / (high - mid)));
    return rgbHex(lerp(GRAD_YELLOW, GRAD_GREEN, mid <= low ? 0 : (mid - value) / (mid - low)));
  }
  const rgba = (hex, a) => { const [r, g, b] = hexRgb(hex); return `rgba(${r},${g},${b},${a})`; };

  /* ---------- disegno SVG (stesse coordinate del Canvas Tk) ---------- */
  const PT = 4 / 3;  // i caratteri Tk sono in punti
  let uid = 0;
  function text(x, y, s, { size = 10, bold = false, fill = C.TEXT, anchor = 'w' } = {}) {
    const ta = anchor === 'e' || anchor === 'ne' ? 'end' : (anchor === 'center' ? 'middle' : 'start');
    const db = anchor === 'nw' || anchor === 'ne' ? 'hanging' : 'central';
    return `<text x="${x}" y="${y}" font-size="${(size * PT).toFixed(1)}" ${bold ? 'font-weight="700"' : ''} fill="${fill}" text-anchor="${ta}" dominant-baseline="${db}">${esc(s)}</text>`;
  }
  function multiline(x, y, s, opts, lineH) {
    return s.split('\n').map((ln, i) => text(x, y + i * lineH, ln, opts)).join('');
  }
  function glowRect(x1, y1, x2, y2, r, color, bg, layers = 4, spread = 2.5, strength = 0.55) {
    let out = '';
    for (let i = layers; i >= 1; i--) {
      const t = strength * Math.pow(1 - (i - 1) / layers, 1.6), g = i * spread;
      out += `<rect x="${x1 - g}" y="${y1 - g}" width="${x2 - x1 + 2 * g}" height="${y2 - y1 + 2 * g}" rx="${r + g}" fill="none" stroke="${blend(bg, color, t)}" stroke-width="${spread + 0.6}"/>`;
    }
    return out;
  }
  function glowCircle(cx, cy, r, color, bg, layers = 3, spread = 2, strength = 0.5) {
    let out = '';
    for (let i = layers; i >= 1; i--) {
      const t = strength * Math.pow(1 - (i - 1) / layers, 1.6);
      out += `<circle cx="${cx}" cy="${cy}" r="${r + i * spread}" fill="none" stroke="${blend(bg, color, t)}" stroke-width="${spread + 0.6}"/>`;
    }
    return out;
  }
  function neonStrip(x1, y1, x2, y2) {
    const id = 'st' + (++uid);
    return `<defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#0f766e"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#059669"/></linearGradient></defs><rect x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" fill="url(#${id})"/>`;
  }
  // Tubo del termometro: rosso in alto, giallo attorno alla media (SMA200), verde in basso.
  function tube(left, right, top, bottom, low, sma, high, price, bg, glowLayers, glowSpread, glowStrength) {
    const id = 'tb' + (++uid);
    const smaOff = Math.min(Math.max((high - sma) / (high - low), 0), 1);
    const capR = (right - left) / 2;
    return glowRect(left, top, right, bottom, capR, gradientColorForValue(price, low, sma, high), bg, glowLayers, glowSpread, glowStrength)
      + `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${rgbHex(GRAD_RED)}"/><stop offset="${smaOff}" stop-color="${rgbHex(GRAD_YELLOW)}"/><stop offset="1" stop-color="${rgbHex(GRAD_GREEN)}"/></linearGradient></defs>`
      + `<rect x="${left}" y="${top}" width="${right - left}" height="${bottom - top}" rx="${capR}" fill="url(#${id})" stroke="${C.TUBE_BORDER}" stroke-width="1"/>`;
  }
  function priceLine(x1, x2, y) {
    return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${C.SHADOW}" stroke-width="6"/>`
      + `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${blend(C.SHADOW, C.PRICE, 0.35)}" stroke-width="4"/>`
      + `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${C.PRICE}" stroke-width="2"/>`;
  }
  function arrowLine(x1, y, x2, color, arrowAt) {  // freccia sottile verso il tubo
    const tip = arrowAt === 'first' ? x1 : x2, dir = arrowAt === 'first' ? 1 : -1;
    return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="1.4"/>`
      + `<polygon points="${tip},${y} ${tip + dir * 9},${y - 3.5} ${tip + dir * 9},${y + 3.5}" fill="${color}"/>`;
  }
  function helpButton(cx, cy, key, bg, r = 12, size = 11) {
    return `<g class="help" data-help="${esc(key)}">${glowCircle(cx, cy, r, C.ACCENT, bg, 3, 1.8, 0.55)}`
      + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${blend(C.CARD_BG, C.ACCENT, 0.18)}" stroke="${C.ACCENT}" stroke-width="1.5"/>`
      + text(cx, cy, '?', { size, bold: true, fill: C.ACCENT, anchor: 'center' }) + '</g>';
  }
  const ratingColor = (r) => (r >= 7 ? C.GOOD : r <= 3 ? C.BAD : C.MARK_SMA);
  function ratingDot(cx, cy, m, r = 9) {
    if (m.rating === null) return '';
    return text(cx, cy, String(m.rating), { size: r >= 9 ? 11 : 9, bold: true, fill: ratingColor(m.rating), anchor: 'center' });
  }
  function statPanel(x1, y1, x2, y2, color, bg) {
    const id = 'sp' + (++uid);
    return glowRect(x1, y1, x2, y2, 14, color, bg, 3, 2, 0.35)
      + `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${blend(C.APP_BG, color, 0.10)}"/><stop offset="1" stop-color="${C.APP_BG}"/></linearGradient></defs>`
      + `<rect x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" rx="14" fill="url(#${id})" stroke="${blend(bg, color, 0.55)}" stroke-width="1"/>`
      + `<rect x="${x1 + 1}" y="${y1 + 14}" width="3" height="${y2 - y1 - 28}" fill="${color}"/>`;
  }
  const yForValue = (v, top, bottom, low, high) => (high <= low ? (top + bottom) / 2 : bottom - ((v - low) / (high - low)) * (bottom - top));
  function scaleFor(m) {
    const low = m.low200, high = m.high200;
    const lowB = m.poc200 !== null ? Math.min(low, m.poc200) : low, highB = m.poc200 !== null ? Math.max(high, m.poc200) : high;
    const pad = Math.max((highB - lowB) * 0.08, 1.0);
    return [lowB - pad, highB + pad];
  }
  function drawMarker(label, value, y, x1, x2, color, align) {
    const textX = align === 'left' ? x2 + 12 : x1 - 12, anchor = align === 'left' ? 'w' : 'e';
    return arrowLine(x1, y, x2, color, align === 'left' ? 'first' : 'last')
      + text(textX, y - 10, label, { size: 11, bold: true, anchor }) + text(textX, y + 12, T.fmtNumber(value), { size: 13, bold: true, fill: color, anchor });
  }

  /* ---------- stato (come la classe App del desktop) ---------- */
  const S = {
    main: T.newMetrics({ label: 'S&P 500', symbol: '^GSPC' }),
    assetMetrics: new Map(),
    sectors: T.fallbackSectors(),
    assets: null, sectorBySymbol: new Map(),
    filterActive: true, threshold: D.SMA_DISTANCE_THRESHOLD,
    priceMin: null, priceMax: null, voteFilter: null,
    semRunning: false, semCancel: false, refreshing: false,
  };
  S.assets = T.flattenSectors(S.sectors);
  S.sectorBySymbol = new Map(S.sectors.flatMap(([n, specs]) => specs.map((s) => [s.symbol, n])));
  // chiave -> metrica (help_boxes / tile_boxes del desktop): un registro per finestra
  const helpTargets = new Map();
  let helpSeq = 0;
  function registerMetric(m, reg = helpTargets) { const k = 'm' + (++helpSeq); reg.set(k, m); return k; }

  function setStatus(t) { $('status').textContent = t; }

  /* ---------- termometro principale ---------- */
  function drawMainThermometer(m) {
    const avail = $('mainCard').clientWidth || 1080;
    const cardW = Math.max(760, Math.min(avail, 1080));
    const core = T.hasCoreValues(m);
    const cardH = core ? 560 : 220;
    const cx = Math.floor(cardW / 2);
    const key = registerMetric(m);
    let s = text(34, 32, m.label, { size: 18, bold: true }) + text(34, 58, 'Minimo · SMA200 · Prezzo attuale · Massimo  (200 sedute)', { size: 10, fill: C.MUTED })
      + neonStrip(34, 72, 34 + Math.min(cardW - 68, 260), 74) + helpButton(cardW - 32, 32, key, C.CARD_BG_2) + ratingDot(cardW - 58, 32, m);
    if (!core) {
      s += text(cx, cardH / 2 + 20, 'Dati non disponibili', { size: 15, bold: true, fill: C.MUTED, anchor: 'center' });
    } else {
      const { price, sma200: sma, low200: low, high200: high } = m;
      const [scaleLow, scaleHigh] = scaleFor(m);
      const top = 96, bottom = 372, tubeW = 34, tubeLeft = cx - Math.floor(tubeW / 2), tubeRight = cx + Math.floor(tubeW / 2);
      const Y = (v) => yForValue(v, top, bottom, scaleLow, scaleHigh);
      s += tube(tubeLeft, tubeRight, top, bottom, scaleLow, sma, scaleHigh, price, C.CARD_BG, 6, 3, 0.6);
      s += drawMarker('Massima 200', high, Y(high), tubeLeft - 128, tubeLeft, C.MARK_HIGH, 'right');
      s += drawMarker('SMA200', sma, Y(sma), tubeRight, tubeRight + 120, C.MARK_SMA, 'left');
      s += drawMarker('Prezzo attuale', price, Y(price), tubeRight, tubeRight + 160, C.PRICE, 'left');
      s += drawMarker('Minima 200', low, Y(low), tubeLeft - 128, tubeLeft, C.MARK_LOW, 'right');
      if (m.poc200 !== null) {
        const py = Y(m.poc200);
        s += `<line x1="${tubeLeft - 4}" y1="${py}" x2="${tubeRight + 4}" y2="${py}" stroke="${C.PURPLE}" stroke-width="2" stroke-dasharray="4 3"/>`;
        s += drawMarker('POC Volume Profile 200p', m.poc200, py, tubeLeft - 200, tubeLeft - 32, C.PURPLE, 'right');
      }
      s += priceLine(tubeLeft - 10, tubeRight + 10, Y(price));
      const distance = T.distanceFromSma(m), hd = T.distanceFromHigh200(m);
      const dc = (distance || 0) >= 0 ? C.GOOD : C.BAD, hc = (hd || 0) >= 0 ? C.GOOD : C.BAD;
      const y1 = bottom + 34, y2 = y1 + 84, gap = 22, w = (cardW - 68 - gap) / 2;
      const a1 = 34, a2 = 34 + w, b1 = a2 + gap, b2 = b1 + w;
      s += statPanel(a1, y1, a2, y2, dc, C.CARD_BG) + statPanel(b1, y1, b2, y2, hc, C.CARD_BG);
      s += text(a1 + 20, y1 + 22, 'DISTANZA vs SMA200', { size: 8, bold: true, fill: C.MUTED }) + text(a1 + 20, y1 + 54, T.fmtPct(distance), { size: 21, bold: true, fill: dc });
      s += text(b1 + 20, y1 + 22, 'DISTANZA vs MASSIMA 200', { size: 8, bold: true, fill: C.MUTED }) + text(b1 + 20, y1 + 54, T.fmtPct(hd), { size: 21, bold: true, fill: hc });
      s += `<line x1="34" y1="${y2 + 26}" x2="${cardW - 34}" y2="${y2 + 26}" stroke="${C.CARD_BORDER}"/>`;
      s += text(cx, y2 + 48, m.source_note, { size: 9, fill: C.MUTED, anchor: 'center' });
    }
    $('mainCard').innerHTML = `<svg viewBox="0 0 ${cardW} ${cardH}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
  }

  /* ---------- mini termometro (tessera) ---------- */
  function tileHtml(m, w = 196, h = 214, badge = null, note = '', showError = false, reg = helpTargets) {
    const key = registerMetric(m, reg);
    let glow;
    if (T.hasCoreValues(m)) glow = (T.distanceFromSma(m) || 0) >= 0 ? C.GOOD : C.BAD; else glow = C.VIOLET;
    const label = m.label.length <= 26 ? m.label : m.label.slice(0, 25) + '…';
    let s = text(16, 15, m.symbol, { size: 12, bold: true, anchor: 'nw' }) + text(16, 37, label, { size: 9, fill: C.MUTED, anchor: 'nw' })
      + helpButton(w - 20, 20, key, C.CARD_BG_2) + ratingDot(w - 42, 20, m, 8);
    if (badge) {
      const [bt, bc] = badge;
      const bx1 = 14, by1 = h - 26, bx2 = bx1 + 12 + bt.length * 6.6;
      s += `<rect x="${bx1}" y="${by1}" width="${bx2 - bx1}" height="16" rx="8" fill="${blend(C.CARD_BG, bc, 0.2)}" stroke="${bc}" stroke-width="1"/>`
        + text((bx1 + bx2) / 2, by1 + 8, bt, { size: 7, bold: true, fill: bc, anchor: 'center' });
      const maxChars = Math.trunc((w - 10 - (bx2 + 6)) / 5.2);
      if (note && maxChars >= 4) s += text(bx2 + 6, by1 + 8, note.length <= maxChars ? note : note.slice(0, maxChars - 1) + '…', { size: 7, fill: C.MUTED });
    }
    if (!T.hasCoreValues(m)) {
      const reason = showError && !!m.error;
      s += text(w / 2, h / 2 + (reason ? -18 : 10), 'N/D', { size: 14, bold: true, fill: C.BAD, anchor: 'center' });
      if (reason) s += multiline(w / 2, h / 2 + 22, wrapText(T.friendlyError(m.error), 30), { size: 8, fill: C.MUTED, anchor: 'center' }, 14);
    } else {
      const [scaleLow, scaleHigh] = scaleFor(m);
      const tl = 38, tr = 46, tt = 68, tbm = h - 40;
      const Y = (v) => yForValue(v, tt, tbm, scaleLow, scaleHigh);
      s += tube(tl, tr, tt, tbm, scaleLow, m.sma200, scaleHigh, m.price, C.CARD_BG, 3, 2, 0.5);
      if (m.poc200 !== null) s += `<line x1="${tl - 6}" y1="${Y(m.poc200)}" x2="${tr + 6}" y2="${Y(m.poc200)}" stroke="${C.PURPLE}" stroke-width="2" stroke-dasharray="3 2"/>`;
      const py = Y(m.price);
      s += `<line x1="${tl - 6}" y1="${py}" x2="${tr + 6}" y2="${py}" stroke="${C.SHADOW}" stroke-width="4"/><line x1="${tl - 6}" y1="${py}" x2="${tr + 6}" y2="${py}" stroke="${C.PRICE}" stroke-width="1.6"/>`;
      const distance = T.distanceFromSma(m) || 0.0, color = distance >= 0 ? C.GOOD : C.BAD;
      const hd = T.distanceFromHigh200(m), hc = (hd || 0) >= 0 ? C.GOOD : C.BAD;
      s += text(74, 72, 'PREZZO', { size: 7, bold: true, fill: C.MUTED, anchor: 'nw' }) + text(74, 88, T.fmtNumber(m.price), { size: 11, bold: true, anchor: 'nw' })
        + text(74, 118, 'VS SMA200', { size: 7, bold: true, fill: C.MUTED, anchor: 'nw' }) + text(74, 134, T.fmtPct(distance), { size: 16, bold: true, fill: color, anchor: 'nw' })
        + text(74, 164, `max200  ${T.fmtPct(hd)}`, { size: 9, bold: true, fill: hc, anchor: 'nw' });
      if (m.poc200 !== null) s += text(74, 182, `POC200  ${T.fmtNumber(m.poc200)}`, { size: 8, bold: true, fill: C.PURPLE, anchor: 'nw' });
    }
    const gl = `--gl-border:${blend(C.CARD_BG, glow, 0.75)};--gl-1:${rgba(glow, 0.28)};--gl-2:${rgba(glow, 0.35)};--gl-3:${rgba(glow, 0.14)}`;
    return `<div class="tile" data-tile="${key}" style="${gl};contain-intrinsic-size:196px ${h}px"><svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${s}</svg></div>`;
  }
  function wrapText(t, maxLen) {
    return t.split('\n').map((line) => {
      const out = []; let cur = '';
      for (const word of line.split(' ')) {
        if (cur && (cur + ' ' + word).length > maxLen) { out.push(cur); cur = word; } else cur = cur ? cur + ' ' + word : word;
      }
      if (cur) out.push(cur);
      return out.join('\n');
    }).join('\n');
  }

  /* ---------- filtri ---------- */
  function passesFilters(m) {
    if (S.filterActive && !T.isBelowSmaAndPoc(m, S.threshold)) return false;
    if (S.priceMin !== null && (m.price === null || m.price < S.priceMin)) return false;
    if (S.priceMax !== null && (m.price === null || m.price > S.priceMax)) return false;
    if (S.voteFilter !== null && m.rating !== S.voteFilter) return false;
    return true;
  }
  function activeFiltersDescription() {
    const bits = [];
    if (S.filterActive) bits.push(`almeno il ${Math.round(S.threshold * 100)}% sotto la media (SMA200) e sotto il POC`);
    if (S.priceMin !== null && S.priceMax !== null) bits.push(`prezzo tra ${T.fmtNumber(S.priceMin)}€ e ${T.fmtNumber(S.priceMax)}€`);
    else if (S.priceMin !== null) bits.push(`prezzo da ${T.fmtNumber(S.priceMin)}€ in su`);
    else if (S.priceMax !== null) bits.push(`prezzo fino a ${T.fmtNumber(S.priceMax)}€`);
    if (S.voteFilter !== null) bits.push(`voto fondamentale = ${S.voteFilter}`);
    return bits.join(' e ');
  }
  function updateFilterButton() {
    $('filterBtn').textContent = S.filterActive ? '👁  Mostra tutte' : `🔎  Solo -${Math.round(S.threshold * 100)}% da media e sotto POC`;
  }
  function updateThresholdButtons() {
    for (const b of $('thresholds').children) {
      const active = S.filterActive && Math.abs(S.threshold - Number(b.dataset.v)) < 1e-9;
      b.className = 'btn small' + (active ? ' accent' : '');
    }
  }
  function updateVoteButtons() {
    for (const b of $('votes').children) b.className = 'btn small' + (S.voteFilter === Number(b.dataset.v) ? ' accent' : '');
  }
  function parsePriceField(t) {
    t = t.trim();
    if (!t || t === D.PRICE_FILTER_NO_BOUND) return null;
    const v = Number(t.replace(',', '.'));
    if (!Number.isFinite(v)) return null;
    return v >= 0 ? v : null;
  }
  function applyPriceFilter() {
    S.priceMin = parsePriceField($('priceMin').value);
    S.priceMax = parsePriceField($('priceMax').value);
    if (S.priceMin !== null && S.priceMax !== null && S.priceMin > S.priceMax) {
      [S.priceMin, S.priceMax] = [S.priceMax, S.priceMin];
      $('priceMin').value = String(Math.trunc(S.priceMin));
      $('priceMax').value = String(Math.trunc(S.priceMax));
    }
    draw();
  }

  /* ---------- disegno della pagina ---------- */
  let drawPending = false;
  function scheduleDraw() { if (!drawPending) { drawPending = true; requestAnimationFrame(() => { drawPending = false; draw(); }); } }
  function draw() {
    helpTargets.clear();
    drawMainThermometer(S.main);
    const anyFilter = S.filterActive || S.priceMin !== null || S.priceMax !== null || S.voteFilter !== null;
    const metricFor = (sp) => S.assetMetrics.get(sp.symbol) || T.newMetrics({ symbol: sp.symbol, label: sp.label, error: 'Non caricato' });
    let html = '';
    if (anyFilter) {
      let nMatch = 0; for (const m of S.assetMetrics.values()) if (passesFilters(m)) nMatch++;
      $('sectionTitle').textContent = 'Mini termometri';
      $('sectionSub').textContent = `Filtro attivo: ${nMatch} su ${S.assets.length} con ${activeFiltersDescription()} · rimuovi i filtri per vederle divise per settore`;
      const matching = S.sectors.flatMap(([, specs]) => specs).map(metricFor).filter(passesFilters);
      if (matching.length) html = `<div class="grid">${matching.map((m) => tileHtml(m)).join('')}</div>`;
      else if (S.assetMetrics.size) html = `<div class="empty">Nessuna azienda corrisponde ai filtri attivi.\nRimuovi o allarga i filtri per vederne altre, o riprova piu' tardi.</div>`;
    } else {
      $('sectionTitle').textContent = 'Mini termometri per settore';
      $('sectionSub').textContent = `${S.assets.length} aziende/asset su ${S.sectors.length} settori · clicca una tessera per il dettaglio`;
      for (const [name, specs] of S.sectors) {
        html += `<div class="sector"><h3>${esc(name)}  (${specs.length})</h3><div class="line"></div></div><div class="grid">${specs.map((sp) => tileHtml(metricFor(sp))).join('')}</div>`;
      }
    }
    $('grids').innerHTML = html;
  }
  function onGridClick(ev) {
    const help = ev.target.closest('[data-help]');
    if (help) { const m = helpTargets.get(help.dataset.help); if (m) openExplanation(m); return; }
    const tile = ev.target.closest('[data-tile]');
    if (tile) { const m = helpTargets.get(tile.dataset.tile); if (m) openDetail(m); }
  }

  /* ---------- aggiornamento dati ---------- */
  async function refresh() {
    $('refreshBtn').disabled = true;
    setStatus("Scarico l'elenco aggiornato dei componenti S&P 500 (Wikipedia)...");
    try {
      const sectors = await T.loadSp500Sectors();
      S.sectors = sectors; S.assets = T.flattenSectors(sectors);
      S.sectorBySymbol = new Map(sectors.flatMap(([n, specs]) => specs.map((s) => [s.symbol, n])));
      const nSectors = sectors.filter(([n]) => n !== D.COMMODITY_SECTOR[0]).length;
      setStatus(`Trovati ${S.assets.length} aziende/asset su ${nSectors} settori. Scarico prezzi e fondamentali...`);
      draw();
      const [main, bySymbol] = await T.loadDashboard(S.assets, (done, total) => {
        setStatus(`Trovati ${S.assets.length} aziende/asset su ${nSectors} settori. Scarico prezzi e fondamentali... ${done}/${total}`);
      });
      S.main = main; S.assetMetrics = bySymbol;
      $('refreshBtn').disabled = false;
      const ok = [...bySymbol.values()].filter(T.hasCoreValues).length;
      setStatus(`Aggiornato: ${main.updated_at} | Mini termometri caricati: ${ok}/${bySymbol.size}`);
      draw();
    } catch (exc) {
      $('refreshBtn').disabled = false;
      setStatus(`Errore: ${exc.message}`);
      messageBox(D.APP_TITLE, exc.message, 'error');
    }
  }

  /* ---------- finestre (Toplevel del desktop) ---------- */
  function openWindow(cls, html) {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="win ${cls}" role="dialog" aria-modal="true"><button class="close" type="button" aria-label="Chiudi">✕</button>${html}</div>`;
    document.body.appendChild(ov);
    const win = ov.firstElementChild;
    win.closeWin = () => { ov.remove(); win.closed = true; };
    win.querySelector('.close').onclick = win.closeWin;
    ov.addEventListener('mousedown', (e) => { if (e.target === ov) win.closeWin(); });
    return win;
  }
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const wins = document.querySelectorAll('.overlay');
    if (wins.length) wins[wins.length - 1].firstElementChild.closeWin();
  });
  function messageBox(title, message, kind = 'info', onOk = null) {
    const win = openWindow('card-win', `<h3>${esc(title)}</h3><div class="txt ${kind === 'error' ? 'bad' : ''}">${esc(message)}</div><div class="btns"><button class="btn accent" type="button">OK</button></div>`);
    const ok = win.querySelector('.btns .btn');
    ok.onclick = () => { win.closeWin(); if (onOk) onOk(); };
    ok.focus();
  }

  // Chiave Gemini: resta nel browser del visitatore (come in Sintesi Mercati AI, di cui
  // riusa la chiave se il visitatore l'ha gia' inserita li').
  const KEY_STORE = 'termometri_gemini_key';
  function getGeminiApiKey() {
    try {
      const own = (localStorage.getItem(KEY_STORE) || '').trim();
      if (own) return own;
      const smai = JSON.parse(localStorage.getItem('smai_keys') || '{}');
      if (smai.GEMINI_API_KEY && smai.GEMINI_API_KEY.trim()) return smai.GEMINI_API_KEY.trim();
    } catch (_) { }
    return null;
  }
  function saveGeminiApiKey(key) { try { localStorage.setItem(KEY_STORE, key.trim()); } catch (_) { } }
  function promptForApiKey(onSaved) {
    const win = openWindow('card-win', `<h3>Configura Gemini</h3>
      <div class="txt">Per generare le spiegazioni serve una API key gratuita di Google Gemini.</div>
      <div class="foot" style="margin-top:4px">Ottienila su: <a href="${esc(D.GEMINI_API_KEY_INFO_URL)}" target="_blank" rel="noopener">${esc(D.GEMINI_API_KEY_INFO_URL)}</a></div>
      <input type="password" autocomplete="off" spellcheck="false" placeholder="Incolla qui la chiave">
      <div class="foot">La chiave resta solo in questo browser, su questo dispositivo: non viene inviata al sito.</div>
      <div class="btns"><button class="btn accent" type="button">Salva e continua</button></div>`);
    const input = win.querySelector('input');
    const existing = getGeminiApiKey();
    if (existing) input.value = existing;
    input.focus();
    const save = () => {
      const key = input.value.trim();
      if (!key) return;
      saveGeminiApiKey(key);
      win.closeWin();
      if (onSaved) onSaved(key);
    };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
    win.querySelector('.btns .btn').onclick = save;
  }

  function openExplanation(m, onRated = null) {
    if (!T.hasCoreValues(m)) { messageBox(D.APP_TITLE, 'Dati non disponibili per generare una spiegazione.'); return; }
    const apiKey = getGeminiApiKey();
    if (!apiKey) { promptForApiKey((key) => showExplanationWindow(m, key, onRated)); return; }
    showExplanationWindow(m, apiKey, onRated);
  }
  function showExplanationWindow(m, apiKey, onRated) {
    const win = openWindow('card-win', `<h3>${esc(m.label)} (${esc(m.symbol)})</h3><div class="sub">Spiegazione fondamentale generata da Gemini...</div>
      <div class="txt muted">Recupero fondamentali da SEC EDGAR e generazione della spiegazione...</div>`);
    const sub = win.querySelector('.sub'), label = win.querySelector('.txt');
    // sfumatura in basso finche' c'e' altro testo da leggere scorrendo
    const fade = () => {
      if (win.closed) { window.removeEventListener('resize', fade); return; }
      label.classList.toggle('more', label.scrollHeight - label.scrollTop - label.clientHeight > 4);
    };
    label.addEventListener('scroll', fade, { passive: true });
    window.addEventListener('resize', fade);
    (async () => {
      try {
        const summary = m.cik ? await T.fetchEdgarFundamentalsSummary(m.cik) : null;
        const raw = await T.askGemini(m, apiKey, summary);
        if (win.closed) return;
        sub.textContent = 'Spiegazione fondamentale generata da Gemini';
        label.textContent = raw.trim(); label.className = 'txt';
        label.scrollTop = 0; fade();
        if (onRated) onRated();
      } catch (exc) {
        if (win.closed) return;
        if (exc instanceof T.GeminiAuthError) {
          win.closeWin();
          messageBox(D.APP_TITLE, "La API key di Gemini non e' valida. Inseriscine una nuova.", 'warning',
            () => promptForApiKey((key) => showExplanationWindow(m, key, onRated)));
          return;
        }
        label.textContent = `Errore nel contattare l'IA: ${exc.message}`; label.className = 'txt bad';
      }
    })();
  }

  /* ---------- dettaglio (open_detail) ---------- */
  function openDetail(m) {
    const win = openWindow('detail', '<div class="win-body"></div>');
    const body = win.querySelector('.win-body');
    const draw = () => {
      if (win.closed) return;
      const W = 780, H = T.hasCoreValues(m) ? 690 : 720;
      const key = 'detail';
      let s = `<rect x="0" y="0" width="${W}" height="64" fill="${C.HEADER_BG}"/>` + neonStrip(0, 64, W, 67)
        + text(28, 32, `${m.label}  (${m.symbol})`, { size: 16, bold: true, fill: C.HEADER_FG });
      const hx = W - 70, hy = 32;  // spostato a sinistra per lasciare spazio alla ✕ di chiusura
      s += ratingDot(hx - 30, hy, m, 11);
      s += `<g class="help" data-help="${key}">${glowCircle(hx, hy, 13, C.ACCENT, C.HEADER_BG, 3, 2, 0.6)}<circle cx="${hx}" cy="${hy}" r="13" fill="${blend(C.HEADER_BG, C.ACCENT, 0.2)}" stroke="${C.ACCENT}" stroke-width="1.5"/>${text(hx, hy, '?', { size: 12, bold: true, fill: C.ACCENT, anchor: 'center' })}</g>`;
      if (!T.hasCoreValues(m)) {
        s += text(W / 2, H / 2, m.error || 'Dati non disponibili', { size: 14, bold: true, fill: C.BAD, anchor: 'center' });
      } else {
        const [scaleLow, scaleHigh] = scaleFor(m);
        const top = 118, bottom = 442, cx = Math.floor(W / 2), tw = 30, tl = cx - Math.floor(tw / 2), tr = cx + Math.floor(tw / 2);
        const Y = (v) => yForValue(v, top, bottom, scaleLow, scaleHigh);
        s += tube(tl, tr, top, bottom, scaleLow, m.sma200, scaleHigh, m.price, C.APP_BG, 6, 3, 0.6);
        const markers = [['Massima 200', m.high200, C.MARK_HIGH, 'left'], ['Prezzo attuale', m.price, C.PRICE, 'right'],
          ['SMA200', m.sma200, C.MARK_SMA, 'right'], ['Minima 200', m.low200, C.MARK_LOW, 'left']];
        if (m.poc200 !== null) {
          const py = Y(m.poc200);
          s += `<line x1="${tl - 4}" y1="${py}" x2="${tr + 4}" y2="${py}" stroke="${C.PURPLE}" stroke-width="2" stroke-dasharray="4 3"/>`;
          markers.push(['POC Volume Profile 200p', m.poc200, C.PURPLE, 'left']);
        }
        for (const [lbl, value, color, side] of markers) {
          const my = Y(value);
          if (side === 'left') {
            s += arrowLine(tl - 120, my, tl, color, 'last') + text(tl - 138, my - 9, lbl, { size: 10, bold: true, anchor: 'e' })
              + text(tl - 138, my + 13, T.fmtNumber(value), { size: 12, bold: true, fill: color, anchor: 'e' });
          } else {
            s += arrowLine(tr, my, tr + 140, color, 'first') + text(tr + 158, my - 9, lbl, { size: 10, bold: true, anchor: 'w' })
              + text(tr + 158, my + 13, T.fmtNumber(value), { size: 12, bold: true, fill: color, anchor: 'w' });
          }
        }
        s += priceLine(tl - 10, tr + 10, Y(m.price));
        const distance = T.distanceFromSma(m), hd = T.distanceFromHigh200(m);
        const dc = (distance || 0) >= 0 ? C.GOOD : C.BAD, hc = (hd || 0) >= 0 ? C.GOOD : C.BAD;
        const y1 = bottom + 46, y2 = bottom + 130, gap = 20, w = (W - 56 - gap) / 2, a1 = 28, a2 = 28 + w, b1 = a2 + gap, b2 = b1 + w;
        s += statPanel(a1, y1, a2, y2, dc, C.APP_BG) + statPanel(b1, y1, b2, y2, hc, C.APP_BG);
        s += text(a1 + 18, y1 + 20, 'DISTANZA vs SMA200', { size: 8, bold: true, fill: C.MUTED }) + text(a1 + 18, y1 + 52, T.fmtPct(distance), { size: 22, bold: true, fill: dc });
        s += text(b1 + 18, y1 + 20, 'DISTANZA vs MASSIMA 200', { size: 8, bold: true, fill: C.MUTED }) + text(b1 + 18, y1 + 52, T.fmtPct(hd), { size: 22, bold: true, fill: hc });
        s += `<line x1="28" y1="${y2 + 30}" x2="${W - 28}" y2="${y2 + 30}" stroke="${C.CARD_BORDER}"/>`;
        s += text(W / 2, y2 + 52, m.source_note, { size: 9, fill: C.MUTED, anchor: 'center' });
        s += text(W / 2, y2 + 74, `200 chiusure usate  ·  aggiornato ${m.updated_at}`, { size: 9, fill: C.MUTED, anchor: 'center' });
      }
      body.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
    };
    body.addEventListener('click', (ev) => { if (ev.target.closest('[data-help]')) openExplanation(m, draw); });
    draw();
  }

  /* ---------- Voto fondamentali (activate_local_semaphore) ---------- */
  function activateLocalSemaphore() {
    const btn = $('semaphoreBtn');
    if (S.semRunning) {
      S.semCancel = true;
      btn.disabled = true; btn.textContent = '⏳ Annullamento...';
      return;
    }
    const candidates = [S.main, ...S.assetMetrics.values()];
    const targets = candidates.filter((m) => passesFilters(m) && m.rating === null && m.cik);
    if (!targets.length) {
      const desc = activeFiltersDescription();
      const reason = desc ? `con ${desc}` : 'attualmente visibili';
      messageBox(D.APP_TITLE, `Nessun termometro ${reason} con dati SEC EDGAR associati, oppure sono gia' tutti stati valutati.`);
      return;
    }
    S.semRunning = true; S.semCancel = false;
    btn.disabled = false; btn.textContent = '⏹  Annulla voto fondamentali';
    const total = targets.length;
    let done = 0, cancelled = false;
    T.poolMap(targets, 16, async (m) => T.computeLocalRating(await T.fetchEdgarFundamentalsData(m.cik), S.sectorBySymbol.get(m.symbol) || ''),
      (res, m) => {
        if (cancelled) return;
        done += 1;
        const rating = res ? res[0] : null;
        if (rating !== null) { m.rating = rating; m.rating_source = 'locale'; }
        setStatus(`Voto fondamentali: ${done}/${total} analizzati...`);
        scheduleDraw();
        if (S.semCancel) cancelled = true;
      }, () => cancelled).then(() => {
      S.semRunning = false; S.semCancel = false;
      btn.disabled = false; btn.textContent = '📊 Voto fondamentali';
      if (cancelled) {
        setStatus(`Voto fondamentali annullato: ${done}/${total} analizzati prima dell'interruzione.`);
      } else {
        S.voteFilter = 10; updateVoteButtons();
        setStatus(`Voto fondamentali completato su ${total} termometri (nessuna IA usata).`);
        draw();
      }
    });
  }

  /* ---------- motore di ricerca ---------- */
  function onSearch() {
    const q = $('searchInput').value.trim();
    if (!q) { $('searchInput').focus(); return; }
    openSearchWindow(q);
  }
  function openSearchWindow(query) {
    const win = openWindow('search-win', `<div class="shead"><h3></h3>
        <form class="search"><input type="search" enterkeyhint="search" autocomplete="off"><button class="btn search-btn" type="submit">Cerca</button></form></div>
      <div class="strip"></div>
      <div class="srow"><div class="st"></div><button class="btn" type="button" hidden>🔑 Configura Gemini</button></div>
      <div class="win-body"></div>`);
    const title = win.querySelector('h3'), form = win.querySelector('form'), input = form.querySelector('input'), sbtn = form.querySelector('button');
    const status = win.querySelector('.st'), keyBtn = win.querySelector('.srow .btn'), body = win.querySelector('.win-body');
    const state = { query, results: null, loading: true, run: 0 };
    const reg = new Map();
    const badgeColors = { 'S&P 500': C.ACCENT, 'Dashboard': C.MARK_SMA, 'SEC EDGAR': C.GOOD, 'Yahoo Finance': C.PURPLE, 'Gemini': C.MAGENTA };
    input.value = query;
    function redraw() {
      if (win.closed) return;
      if (state.loading) { body.innerHTML = '<div class="loading"><b>Cerco su SEC EDGAR, Yahoo Finance e Gemini…</b><span>poi scarico prezzi, SMA200 e POC di ogni risultato</span></div>'; return; }
      if (!state.results.length) {
        body.innerHTML = `<div class="loading none"><b>Nessun termometro trovato.</b><span>Prova con il ticker, il nome dell'azienda o una parola diversa (es. "oro", "Ferrari", "Nasdaq").</span></div>`;
        return;
      }
      reg.clear();
      body.innerHTML = `<div class="grid">${state.results.map(([h, m]) => {
        let bt = h.source === 'Yahoo Finance' ? 'YAHOO' : h.source.toUpperCase();
        if ((h.source === 'Gemini' || h.source === 'Yahoo Finance') && m.cik) bt += ' + SEC';
        return tileHtml(m, 196, 240, [bt, badgeColors[h.source] || C.VIOLET], h.note, true, reg);
      }).join('')}</div>`;
    }
    body.addEventListener('click', (ev) => {
      const help = ev.target.closest('[data-help]');
      if (help) { const m = reg.get(help.dataset.help); if (m) openExplanation(m, redraw); return; }
      const tile = ev.target.closest('[data-tile]');
      if (tile) { const m = reg.get(tile.dataset.tile); if (m) openDetail(m); }
    });
    async function runSearch(newQuery) {
      newQuery = newQuery.trim();
      if (!newQuery) return;
      Object.assign(state, { query: newQuery, results: null, loading: true });
      const runId = ++state.run;
      title.textContent = `Risultati per «${newQuery}»`;
      status.textContent = 'Ricerca in corso…'; status.className = 'st';
      keyBtn.hidden = true; sbtn.disabled = true;
      redraw();
      const apiKey = getGeminiApiKey();
      const known = new Map(S.sectors.flatMap(([name, specs]) => specs.map((sp) => [sp.symbol, [sp, name]])));
      const existing = new Map(S.assetMetrics);
      let results = [], notes = [], errorText = null;
      try {
        const [hits, n] = await T.searchThermometers(newQuery, apiKey, known);
        notes = n;
        let edgarMap;
        try { edgarMap = new Map((await T.loadEdgarCompanyIndex()).map((c) => [c.ticker, [c.name, c.cik]])); } catch (_) { edgarMap = new Map(); }
        const metrics = new Array(hits.length);
        await T.poolMap(hits.map((h, i) => [h, i]), 8, async ([h, i]) => { metrics[i] = await T.resolveSearchHit(h, existing, edgarMap); });
        const seen = new Set();
        hits.forEach((h, i) => {
          const m = metrics[i];
          if (!m || seen.has(h.spec.symbol)) return;
          seen.add(h.spec.symbol);
          results.push([h, m]);
        });
      } catch (exc) {
        results = []; notes = []; errorText = `Errore nella ricerca: ${exc.message}`;
      }
      if (win.closed || runId !== state.run) return;
      Object.assign(state, { results, loading: false });
      sbtn.disabled = false;
      if (errorText) { status.textContent = errorText; status.className = 'st bad'; } else {
        const ok = results.filter(([, m]) => T.hasCoreValues(m)).length;
        const sources = [...new Set(results.map(([h]) => h.source))].sort();
        let t = `${results.length} risultati (${ok} con dati completi)` + (sources.length ? ` · fonti: ${sources.join(', ')}` : '')
          + ' · clic sulla tessera = dettaglio, «?» = spiegazione Gemini';
        if (notes.length) t += '\n' + notes.join(' ');
        status.textContent = t; status.className = 'st';
        if (notes.some((n) => n.includes('non configurato') || n.includes('non valida'))) keyBtn.hidden = false;
      }
      redraw();
    }
    keyBtn.onclick = () => promptForApiKey(() => runSearch(state.query));
    form.addEventListener('submit', (e) => { e.preventDefault(); runSearch(input.value); });
    runSearch(query);
  }

  /* ---------- avvio ---------- */
  (function setup() {
    for (const pct of D.SMA_THRESHOLD_OPTIONS) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = `${Math.round(pct * 100)}%`; b.dataset.v = pct;
      b.onclick = () => { S.threshold = pct; S.filterActive = true; updateFilterButton(); updateThresholdButtons(); draw(); };
      $('thresholds').appendChild(b);
    }
    for (const v of D.VOTE_FILTER_CHOICES) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = String(v); b.dataset.v = v;
      b.onclick = () => { S.voteFilter = S.voteFilter === v ? null : v; updateVoteButtons(); draw(); };
      $('votes').appendChild(b);
    }
    for (const sel of [$('priceMin'), $('priceMax')]) {
      sel.innerHTML = D.PRICE_FILTER_OPTIONS.map((o) => `<option>${esc(o)}</option>`).join('');
      sel.value = D.PRICE_FILTER_OPTIONS[0];
      sel.onchange = applyPriceFilter;
    }
    $('priceReset').onclick = () => {
      S.priceMin = null; S.priceMax = null;
      $('priceMin').value = D.PRICE_FILTER_NO_BOUND; $('priceMax').value = D.PRICE_FILTER_NO_BOUND;
      draw();
    };
    $('filterBtn').onclick = () => { S.filterActive = !S.filterActive; updateFilterButton(); updateThresholdButtons(); draw(); };
    updateFilterButton(); updateThresholdButtons(); updateVoteButtons();
    $('refreshBtn').onclick = refresh;
    $('semaphoreBtn').onclick = activateLocalSemaphore;
    $('keyBtn').onclick = () => promptForApiKey(null);
    $('searchForm').addEventListener('submit', (e) => { e.preventDefault(); onSearch(); });
    $('grids').addEventListener('click', onGridClick);
    $('mainCard').addEventListener('click', onGridClick);
    let lastW = 0;
    window.addEventListener('resize', () => { const w = $('mainCard').clientWidth; if (w !== lastW) { lastW = w; drawMainThermometer(S.main); } });
    draw();
    refresh();
  })();
})();
</script>
