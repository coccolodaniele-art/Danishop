<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Usato</title>
  <meta name="description" content="Articoli di seconda mano, programmi e contatti.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a34'/%3E%3Cpath d='M18 24h28l-3 24H21z' fill='%23f6efe3'/%3E%3Cpath d='M25 24a7 7 0 0 1 14 0' stroke='%23f6efe3' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#shop">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 8h14l-1.3 12H6.3z" fill="currentColor"/><path d="M9 8a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </span>
      <span class="brand-text">
        <strong id="brandName">Il mio sito</strong>
        <small id="brandTagline"></small>
      </span>
    </a>
    <nav class="nav" aria-label="Sezioni">
      <a href="#shop" data-nav="shop">Shop usato</a>
      <a href="#programmi" data-nav="programmi">Programmi</a>
      <a href="#info" data-nav="info">Info e contatti</a>
    </nav>
  </header>

  <div id="draftBanner" class="draft-banner" hidden>
    Stai vedendo le modifiche salvate in questo browser. I visitatori le vedranno dopo la pubblicazione.
    <a href="#admin">Vai all'area admin</a>
  </div>

  <main id="app" class="main" tabindex="-1"></main>

  <footer class="footer">
    <span id="footerText"></span>
    <a href="#admin" class="footer-lock" title="Area riservata" aria-label="Area riservata">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </a>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-x" data-close aria-label="Chiudi">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
