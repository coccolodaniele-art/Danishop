<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertitore di file</title>
<meta name="description" content="Carica un file e convertilo in un altro formato: immagini, PDF, documenti, fogli Excel, audio e video. Tutto nel browser, senza caricare niente su internet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230b2530'/%3E%3Cstop offset='1' stop-color='%2312384a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M18 26h24l-6-6M46 38H22l6 6' fill='none' stroke='%235eead4' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#e3f3f0">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  /* Tema del sito (Coccolo Digital): fondo acqua, un accento verde petrolio, dettagli blu-petrolio scuro. */
  :root {
    --panel: #ffffff;
    --sunken: #f1f8f7;
    --line: rgba(13, 79, 87, .12);
    --line-strong: rgba(13, 79, 87, .22);
    --ink: #0b2530;
    --text-2: #2b4752;
    --muted: #5a7480;
    --accent: #0f766e;
    --accent-hover: #115e59;
    --accent-soft: rgba(15, 118, 110, .08);
    --accent-line: rgba(15, 118, 110, .32);
    --ok: #059669;
    --bad: #dc2626;
    --deep: #0b2530;
    --deep-2: #12384a;
    --shadow: 0 1px 2px rgba(11, 37, 48, .05), 0 10px 28px rgba(13, 79, 87, .08);
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: #eaf4f3; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; line-height: 1.55; color: var(--ink);
    background:
      radial-gradient(ellipse 60% 45% at 10% -5%, rgba(20, 184, 166, .2), transparent 70%),
      radial-gradient(ellipse 55% 40% at 95% 0%, rgba(14, 165, 233, .16), transparent 70%),
      linear-gradient(180deg, #e3f3f0, #eef5f8);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: radial-gradient(rgba(13, 79, 87, .13) 1px, transparent 1px); background-size: 26px 26px; mask-image: linear-gradient(180deg, #000, transparent 70%); -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- barra in alto ---------- */
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 12px clamp(16px, 4vw, 40px); background: rgba(240, 249, 247, .85); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, #14b8a6, #0ea5e9 60%, transparent); opacity: .5; }
  .logo { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  .logo-mark { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, var(--deep), var(--deep-2)); color: #5eead4; }
  .logo-mark svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .spacer { flex: 1; }
  .lang { border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); padding: 6px 10px; font-size: 13.5px; font-weight: 600; color: var(--text-2); }
  .back { font-size: 13.5px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .back:hover { color: var(--accent); }

  main { flex: 1; width: 100%; max-width: 920px; margin: 0 auto; padding: clamp(28px, 5vw, 56px) clamp(16px, 4vw, 40px) 56px; }
  .hero { text-align: center; margin: 0 auto 26px; }
  .hero h1 { margin: 0 0 12px; font-size: clamp(1.9rem, 4.4vw, 2.8rem); line-height: 1.08; letter-spacing: -.04em; font-weight: 800; text-wrap: balance; }
  .hero p { margin: 0 auto; max-width: 640px; color: var(--text-2); font-size: 1.05rem; }
  .pills { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--accent-line); color: var(--accent); font-size: 13px; font-weight: 600; }
  .pill svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- zona dove trascinare i file ---------- */
  .drop {
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; cursor: pointer;
    padding: 38px 20px; border-radius: 16px;
    border: 2px dashed var(--accent-line); background: radial-gradient(rgba(15, 118, 110, .12) 1px, transparent 1px) 0 0 / 14px 14px, var(--panel);
    box-shadow: var(--shadow);
    transition: border-color .2s, background-color .2s, transform .2s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background-color: #f0faf8; }
  .drop.over { transform: scale(1.01); }
  .drop.compact { flex-direction: row; justify-content: center; padding: 14px 20px; gap: 12px; }
  .drop-ico { width: 56px; height: 56px; border-radius: 15px; display: grid; place-items: center; background: linear-gradient(135deg, var(--deep), var(--deep-2)); color: #5eead4; box-shadow: 0 8px 20px rgba(11, 37, 48, .2); margin-bottom: 8px; }
  .drop.compact .drop-ico { width: 38px; height: 38px; border-radius: 10px; margin: 0; }
  .drop-ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .drop.compact .drop-ico svg { width: 19px; height: 19px; }
  .drop strong { font-size: 1.12rem; }
  .drop.compact strong { font-size: .98rem; }
  .drop .or { color: var(--muted); font-size: .94rem; }
  .drop .or u { color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--accent-line); }
  .drop small { color: var(--muted); font-size: .84rem; }
  .drop.compact small, .drop.compact .or { display: none; }

  /* ---------- elenco dei file ---------- */
  .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 22px 0 12px; }
  .toolbar .grow { flex: 1; }
  .toolbar b { font-size: .95rem; }
  .linkbtn { border: 0; background: none; padding: 4px 2px; color: var(--muted); font-size: .86rem; }
  .linkbtn:hover { color: var(--bad); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border-radius: 9px; border: 1px solid transparent; background: var(--accent); color: #fff; font-weight: 700; font-size: .9rem; text-decoration: none; box-shadow: 0 1px 2px rgba(11, 37, 48, .1), 0 6px 16px rgba(15, 118, 110, .22); transition: background .2s, transform .1s; white-space: nowrap; }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .all { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 12px 14px; margin-bottom: 14px; border-radius: 12px; background: rgba(255, 255, 255, .7); border: 1px dashed var(--accent-line); }
  .all > span { font-size: .86rem; font-weight: 600; color: var(--text-2); margin-right: 4px; }

  .files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .file { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; animation: pop .25s ease both; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .file-head { display: flex; align-items: center; gap: 14px; }
  .thumb { flex: none; width: 52px; height: 52px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; background: linear-gradient(135deg, var(--deep), var(--deep-2)); color: #5eead4; font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
  .thumb { position: relative; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--sunken); }
  .meta { flex: 1; min-width: 0; }
  .meta b { display: block; font-size: .98rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta span { font-size: .84rem; color: var(--muted); }
  .kind { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .76rem; }
  .x { flex: none; width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; }
  .x:hover { background: #fef2f2; color: var(--bad); }

  .targets { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .targets > span { display: block; margin-bottom: 8px; font-size: .84rem; font-weight: 600; color: var(--text-2); }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
  .group + .group { margin-top: 10px; }
  .group i { font-style: normal; width: 100%; font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .fmt { min-width: 64px; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line-strong); background: #fff; font-family: var(--mono); font-weight: 600; font-size: .86rem; color: var(--text-2); transition: border-color .15s, color .15s, background .15s, transform .1s; }
  .fmt:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .fmt:active { transform: translateY(1px); }
  .fmt.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(15, 118, 110, .25); }
  .hint { margin: 10px 0 0; font-size: .8rem; color: var(--muted); }

  .out { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 11px 12px 11px 14px; border-radius: 11px; }
  .out.work { background: var(--sunken); border: 1px solid var(--line); }
  .out.done { background: #ecfdf7; border: 1px solid #b7ebdc; }
  .out.error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; font-size: .88rem; }
  .out .meta b { font-size: .9rem; }
  .bar { flex: 1; height: 7px; border-radius: 9px; background: rgba(13, 79, 87, .12); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #14b8a6, #0ea5e9); transition: width .3s; }
  .bar.indef i { width: 35%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  .out .label { font-size: .84rem; color: var(--muted); white-space: nowrap; }
  .ok-ico { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #fff; }
  .ok-ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

  .how { margin-top: 44px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .how div { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: 12px; background: rgba(255, 255, 255, .7); border: 1px solid var(--line); color: var(--text-2); font-size: .92rem; }
  .how svg { flex: none; width: 34px; height: 34px; padding: 8px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .formats { margin: 26px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .formats div { padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, .55); border: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
  .formats b { display: block; margin-bottom: 3px; font-size: .86rem; color: var(--text-2); }
  .formats code { font-family: var(--mono); font-size: .76rem; }
  .formats-title { margin: 40px 0 0; text-align: center; font-size: 1.15rem; letter-spacing: -.02em; }
  footer { padding: 22px; text-align: center; color: var(--muted); font-size: .84rem; border-top: 1px solid var(--line); background: rgba(240, 249, 247, .7); }
  footer a { font-weight: 600; text-decoration: none; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; padding: 10px 16px; border-radius: 10px; background: var(--deep); color: #fff; font-size: .9rem; box-shadow: 0 12px 30px rgba(11, 37, 48, .3); transition: opacity .25s, transform .25s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 760px) { .how { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) {
    .logo { font-size: 16px; }
    .topbar { gap: 10px; }
    .back { font-size: 0; }
    .back::before { content: "←"; font-size: 22px; line-height: 1; }
    .file { padding: 14px; }
    .fmt { min-width: 0; flex: 1 0 calc(25% - 7px); padding: 9px 4px; }
    .out { flex-wrap: wrap; }
    .out .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="./">
      <span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M5 9h13l-4-4"/><path d="M19 15H6l4 4"/></svg></span>
      <span data-t="appName">Convertitore</span>
    </a>
    <span class="spacer"></span>
    <select class="lang" id="lang" aria-label="Lingua"></select>
    <a class="back" href="../#strumenti" id="back" data-t="back">← Torna al sito</a>
  </header>

  <main>
    <section class="hero">
      <h1 data-t="heroTitle">Converti un file in un altro formato</h1>
      <p data-t="heroSub"></p>
      <div class="pills">
        <span class="pill"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span data-t="pillPrivate"></span></span>
        <span class="pill"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span data-t="pillFree"></span></span>
        <span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span data-t="pillNoInstall"></span></span>
      </div>
    </section>

    <label class="drop" id="drop">
      <input type="file" id="picker" multiple hidden>
      <span class="drop-ico"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
      <strong data-t="dropTitle"></strong>
      <span class="or"><span data-t="dropOr"></span> <u data-t="dropPick"></u></span>
      <small data-t="dropHint"></small>
    </label>

    <div id="list" hidden>
      <div class="toolbar">
        <b id="count"></b>
        <span class="grow"></span>
        <button class="btn" id="zip" hidden></button>
        <button class="linkbtn" id="clear" data-t="clear"></button>
      </div>
      <div class="all" id="all" hidden></div>
      <ul class="files" id="files"></ul>
    </div>

    <section class="how">
      <div><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span data-t="how1"></span></div>
      <div><svg viewBox="0 0 24 24"><path d="M5 9h13l-4-4"/><path d="M19 15H6l4 4"/></svg><span data-t="how2"></span></div>
      <div><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8.6 8 9 4.6-.4 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span data-t="how3"></span></div>
    </section>
    <h2 class="formats-title" data-t="formatsTitle"></h2>
    <div class="formats" id="formats"></div>
  </main>

  <footer><span data-t="madeBy"></span> <a href="../" id="home">Coccolo Digital</a></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
